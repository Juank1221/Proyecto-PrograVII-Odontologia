    <script>
        // El tema se aplica antes de cargar la hoja de estilos para evitar el
        // destello claro en el primer render. La preferencia guardada manda;
        // si no existe se usa la del sistema operativo.
        (function () {
            window.odontocareTema = {
                estaOscuro: function () {
                    return document.documentElement.getAttribute('data-theme') === 'dark';
                },
                aplicar: function (oscuro) {
                    var tema = oscuro ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', tema);
                    document.documentElement.style.colorScheme = tema;
                    try {
                        localStorage.setItem('odontocare.tema', tema);
                    } catch (e) {
                        // Sin localStorage el tema funciona durante la sesión.
                    }
                }
            };

            try {
                var guardado = localStorage.getItem('odontocare.tema');
                var prefiereOscuro = window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var oscuro = guardado ? guardado === 'dark' : prefiereOscuro;
                window.odontocareTema.aplicar(oscuro);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

<script>
    // Descarga un archivo generado por la API (por ejemplo, la exportacion de bitacoras).
    window.odontocareDescargarArchivo = function (nombre, base64, tipo) {
        var binario = atob(base64);
        var bytes = new Uint8Array(binario.length);
        for (var i = 0; i < binario.length; i++) { bytes[i] = binario.charCodeAt(i); }
        var blob = new Blob([bytes], { type: tipo || 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = nombre;
        document.body.appendChild(enlace);
        enlace.click();
        document.body.removeChild(enlace);
        URL.revokeObjectURL(url);
    };
